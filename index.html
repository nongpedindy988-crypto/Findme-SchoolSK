<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FindMe School</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            text-align: center;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 30px;
        }

        .box {
            background: white;
            width: 80%;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <header>
        <h1>🔎 FindMe School</h1>
        <p>ระบบแจ้งและติดตามสิ่งของสูญหายภายในโรงเรียน</p>
    </header>

    <div class="box">

        <h2>ยินดีต้อนรับ 👋</h2>

        <p>
            เว็บไซต์สำหรับแจ้งสิ่งของสูญหาย
            และแจ้งสิ่งของที่พบภายในโรงเรียน
        </p>

        <button onclick="welcome()">
            เริ่มต้นใช้งาน
        </button>

    </div>

    <script>
        function welcome() {
            alert("ยินดีต้อนรับสู่ FindMe School!");
        }
    </script>

</body>
</html>
